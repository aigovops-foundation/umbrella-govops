name: Feature request
description: Suggest a new framework, control, check, SDK feature, or workflow improvement
title: "feat: <one-line summary>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to propose new functionality. For new frameworks or
        crosswalk rows, please also link the authoritative source document.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of feature?
      options:
        - New framework / regulation to compile
        - New unified control ID (UCID) or crosswalk row
        - New control or domain
        - New check / runner
        - Conformance CLI capability
        - Python or TypeScript SDK API
        - Test harness improvement
        - CI / release / signing workflow
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What governance problem does this solve?
      description: Describe the audit finding, regulator question, or developer pain you're trying to close.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Sketch the API, schema change, or content. Pseudocode and YAML drafts are great.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: textarea
    id: sources
    attributes:
      label: Authoritative sources
      description: Links to regulations, standards, or published guidance that justify the proposal.
      placeholder: |
        - NIST AI RMF MEASURE-2.7
        - EU AI Act Article 15(4)
        - ISO/IEC 42001:2023 §6.1.3

  - type: checkboxes
    id: willing
    attributes:
      label: Would you be willing to contribute?
      options:
        - label: I'd like to open the PR myself.
        - label: I can review or test someone else's PR.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's [Code of Conduct](https://github.com/bobrapp/umbrella-govops/blob/main/CODE_OF_CONDUCT.md).
          required: true
