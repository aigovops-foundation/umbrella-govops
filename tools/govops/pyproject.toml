[project]
name = "govops"
version = "0.0.1"
description = "Engine for Umbrella-GovOps: parse, compile, evaluate, and attest governance controls."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
  "click>=8.1",
]

[project.scripts]
govops = "govops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
