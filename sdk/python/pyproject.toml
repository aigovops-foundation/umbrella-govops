[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "umbrella-sdk"
version = "0.1.0a1"
description = "Python SDK for Umbrella-GovOps — controls, evidence, crosswalk, journeys"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "AIGovOps Foundation", email = "hello@aigovops.org" }
]
keywords = ["ai-governance", "compliance", "policy-as-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.urls]
Homepage = "https://bobrapp.github.io/umbrella-govops/"
Source = "https://github.com/bobrapp/umbrella-govops"

[tool.setuptools.packages.find]
where = ["src"]
