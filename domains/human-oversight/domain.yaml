apiVersion: govops.aigovops.org/v1
kind: GovernanceDomain
metadata:
  id: human-oversight
  code: HO
  name: Human Oversight
  owner: "@bobrapp"
  description: |
    Operator controls, override paths, and escalation. EU AI Act Article 14 and NIST GOVERN-3.2 / MANAGE-2.4.

risk_tier_applicability: ["high", "limited", "minimal"]

slos:
  - metric: control_pass_rate
    target: ">= 0.95"
  - metric: evidence_freshness_days
    target: "<= 7"
