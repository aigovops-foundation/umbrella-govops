apiVersion: govops.aigovops.org/v1
kind: GovernanceDomain
metadata:
  id: security-robustness
  code: SR
  name: Security & Robustness
  owner: "@bobrapp"
  description: |
    Adversarial testing, red-team exercises, accuracy targets, and resilience. EU AI Act Article 15 and NIST MEASURE-2.7.

risk_tier_applicability: ["high", "limited", "minimal"]

slos:
  - metric: control_pass_rate
    target: ">= 0.95"
  - metric: evidence_freshness_days
    target: "<= 7"
