apiVersion: govops.aigovops.org/v1
kind: GovernanceDomain
metadata:
  id: incident-response
  code: IR
  name: Incident Response
  owner: "@bobrapp"
  description: |
    Serious-incident disclosure packages and corrective action. EU AI Act Article 73.

risk_tier_applicability: ["high", "limited", "minimal"]

slos:
  - metric: control_pass_rate
    target: ">= 0.95"
  - metric: evidence_freshness_days
    target: "<= 7"
