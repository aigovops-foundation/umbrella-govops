# NIST AI Risk Management Framework 1.0 — minimal OSCAL catalog stub.
# Source: https://nvlpubs.nist.gov/nistpubs/ai/nist.ai.100-1.pdf
# Expand subcategories as Sprint 1 of the Umbrella roadmap.

catalog:
  uuid: 8b3e3c8e-0000-4000-a000-aifmf-2023
  metadata:
    title: NIST AI Risk Management Framework 1.0
    version: "1.0"
    last-modified: 2023-01-26T00:00:00Z
    oscal-version: 1.1.2
    parties:
      - uuid: nist
        type: organization
        name: National Institute of Standards and Technology

  groups:
    - id: govern
      title: GOVERN
      controls:
        - id: GOVERN-1.1
          title: Legal and regulatory requirements involving AI are understood, managed, and documented.
        - id: GOVERN-3.2
          title: Policies and procedures are in place to define and differentiate roles and responsibilities for human-AI configurations and oversight.
    - id: map
      title: MAP
      controls:
        - id: MAP-2.3
          title: Scientific integrity and TEVV considerations are identified and documented.
        - id: MAP-4.1
          title: Approaches for mapping AI technology and legal risks of its components are documented.
    - id: measure
      title: MEASURE
      controls:
        - id: MEASURE-2.7
          title: AI system security and resilience are evaluated and documented.
        - id: MEASURE-2.8
          title: Risks associated with transparency and accountability are examined and documented.
        - id: MEASURE-2.11
          title: Fairness and bias are evaluated and results are documented.
    - id: manage
      title: MANAGE
      controls:
        - id: MANAGE-2.3
          title: Procedures are in place to respond to and recover from a previously unknown risk.
        - id: MANAGE-2.4
          title: Mechanisms are in place to supersede, disengage, or deactivate AI systems that demonstrate performance or outcomes inconsistent with intended use.
        - id: MANAGE-4.1
          title: Post-deployment AI system monitoring plans are implemented, including capture of incidents, errors, and negative impacts.
